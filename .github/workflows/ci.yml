name: CI

on:
  push:
    branches: [main]
  pull_request:

# Đẩy commit mới lên cùng một branch thì huỷ lượt chạy cũ — không có lý do gì để
# trả tiền cho kết quả của một commit vừa bị thay thế.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Backend chạy `--env-file-if-exists`, cờ này cần Node 20 trở lên.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cài dependency
        working-directory: backend
        run: npm ci

      # mongodb-memory-server tải sẵn binary về cache; nếu không, mỗi job lại tải
      # lại ~100MB và thỉnh thoảng hết giờ.
      - name: Cache binary MongoDB
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài dependency
        working-directory: frontend
        run: npm ci

      # `tsc --noEmit` trong thư mục này KHÔNG kiểm tra gì cả: nó phân giải về
      # tsconfig.json gốc kiểu solution với `"files": []`. Phải là `tsc -b`.
      - name: Kiểm tra kiểu
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # Build là một cổng kiểm tra riêng: có những lỗi chỉ Rollup mới thấy (import
      # vòng, asset thiếu) mà tsc và vitest đều cho qua.
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    # Vercel vẫn nhận push từ repo này — preview cho mọi branch đều chạy bình
    # thường — nhưng chưa bao giờ tự tạo deployment production cho main: xem lại
    # lịch sử thì mọi bản production từ trước tới nay đều là `source=cli`, không
    # có bản nào `source=git`. Cài đặt project nhìn đều đúng (createDeployments
    # enabled, productionBranch main, không có ignore command), nên nguyên nhân
    # nằm ở đâu đó không đọc được qua API.
    #
    # Đặt trigger ở đây thì nó nằm trong repo, có version, và ai cũng nhìn thấy —
    # thay vì phải nhớ chạy tay `vercel --prod` sau mỗi lần merge.
    #
    # Chỉ chạy khi đã đẩy lên main và cả hai job kia xanh: không deploy thứ chưa
    # qua test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]

    env:
      # Hai cái này không phải bí mật, chỉ là định danh — mở dashboard hay xem URL
      # deployment là thấy. Chỉ VERCEL_TOKEN mới cần nằm trong Settings → Secrets.
      VERCEL_ORG_ID: team_7EGwbxuzG2myqFmvgNymf0Jk
      VERCEL_PROJECT_ID: prj_7fFlPQiFnpoHTyageFgv0oMOI7kM

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Thiếu token thì `vercel` báo một lỗi khó hiểu ở tận bước sau. Nói thẳng ra
      # đây, kèm chỗ để đi lấy.
      - name: Kiểm tra token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Thiếu secret VERCEL_TOKEN. Tạo ở https://vercel.com/account/tokens rồi thêm vào Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Cài Vercel CLI
        run: npm i -g vercel@latest

      # Chạy từ gốc repo, KHÔNG cd vào frontend: `rootDirectory` (= frontend) nằm
      # trong cài đặt project, Vercel tự áp dụng sau khi nhận source. Vào sẵn
      # frontend thì nó lại đi tìm frontend/frontend.
      #
      # `--meta` để dashboard vẫn gắn được deployment với commit; deploy bằng CLI
      # thì không tự có metadata git như bản `source=git`.
      - name: Deploy lên production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail

          vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="${GITHUB_REF#refs/heads/}" \
            --meta githubRepo="$GITHUB_REPOSITORY" \
            | tee deployment-url.txt

          echo "Production: $(tail -n1 deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest

    # Backend nằm trên Render, KHÔNG deploy kèm frontend, và kết nối GitHub của
    # service đã đứt: không còn webhook nào, nên push lên main không báo cho Render
    # biết gì cả. Auto-Deploy vẫn hiển thị "On Commit", nên nhìn dashboard thì mọi
    # thứ đều bình thường trong khi backend đứng yên — đã từng trôi 23 commit trước
    # khi có người nhận ra.
    #
    # Job này thay cho cái webhook đã mất. Nó cố tình KHÔNG dùng deploy hook
    # (`POST https://api.render.com/deploy/...`): hook chỉ có nghĩa "deploy latest
    # commit", mà với link đã đứt thì "latest" là ref Render còn nhớ được — một SHA
    # đóng băng từ lần cuối nó học được. Bấm bao nhiêu lần cũng build lại đúng commit
    # cũ đó. Ở đây gọi thẳng API và GHIM `commitId`, nên Render buộc phải checkout
    # đúng commit vừa merge (repo public nên nó clone ẩn danh được).
    #
    # Đây là cách chữa triệu chứng. Cách chữa gốc vẫn là nối lại GitHub ở
    # Settings → Build → Source, việc đó cần một lượt cấp quyền OAuth mà chỉ chủ tài
    # khoản bấm được.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]

    env:
      # Có HAI service backend trong tài khoản Render, tên gần giống nhau. Chỉ
      # service này phục vụ `chat-app-backend-tgcb.onrender.com` — cái mà
      # `frontend/.env.production` trỏ tới. Deploy nhầm cái kia vẫn build thành công,
      # vẫn xanh, và URL thật thì không đổi gì. Ghim id ở đây để không bao giờ phải
      # đoán bằng tên nữa.
      RENDER_SERVICE_ID: srv-da1c1cm1egvs73af1nlg
      HEALTH_URL: https://chat-app-backend-tgcb.onrender.com/health

    steps:
      # Nói thẳng ra đây thay vì để curl trả về 401 khó hiểu ở bước sau.
      - name: Kiểm tra API key
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Thiếu secret RENDER_API_KEY. Tạo ở https://dashboard.render.com/u/settings#api-keys rồi thêm vào Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Kích hoạt deploy, ghim đúng commit vừa merge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          response=$(curl -sS -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$GITHUB_SHA\", \"clearCache\": \"do_not_clear\"}")

          deploy_id=$(jq -r '.id // empty' <<<"$response")

          if [ -z "$deploy_id" ]; then
            echo "::error::Render không tạo được deploy. Phản hồi: $response"
            exit 1
          fi

          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Deploy $deploy_id cho commit $GITHUB_SHA"

      - name: Chờ Render build xong
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail

          # Bình thường 2–4 phút. Nhưng lần deploy ngay sau khi nối lại GitHub từng
          # mất 21 phút, nên trần ở đây là 30 phút chứ không phải 10 — bỏ cuộc sớm
          # sẽ báo đỏ một bản deploy thực ra đang chạy bình thường.
          for _ in $(seq 1 120); do
            status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status // "unknown"' || echo "unknown")

            echo "trạng thái: $status"

            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy Render kết thúc ở trạng thái '$status'. Xem log: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Quá 30 phút mà deploy vẫn chưa Live."
          exit 1

      # Bước QUAN TRỌNG NHẤT của job này.
      #
      # Cả lịch sử sự cố của service này đều có chung một hình dạng: build xanh,
      # dashboard xanh, service Live — và commit đang chạy thì vẫn là commit cũ.
      # Xảy ra với ref đóng băng, và xảy ra với service orphan. Trạng thái "live" ở
      # bước trên KHÔNG loại trừ được cái nào trong hai thứ đó.
      #
      # Chỉ có một bằng chứng thật: hỏi chính tiến trình đang chạy nó là commit nào.
      # `/health` trả về `RENDER_GIT_COMMIT`, tức SHA do Render gắn vào lúc deploy.
      - name: Xác minh /health đúng commit vừa deploy
        run: |
          set -uo pipefail

          commit=""

          # Gói free ngủ đông sau một lúc không có request, và lần gọi đầu để đánh
          # thức có thể mất gần một phút — nên `-m 90`, và thử lại vài lượt.
          for _ in $(seq 1 20); do
            body=$(curl -sS -m 90 "$HEALTH_URL" || true)
            commit=$(jq -r '.commit // empty' <<<"$body" 2>/dev/null || true)

            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "✅ Backend đang chạy đúng $GITHUB_SHA"
              echo "Backend: \`$GITHUB_SHA\` đã live" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "/health báo '$commit', đang chờ '$GITHUB_SHA'"
            sleep 15
          done

          echo "::error::Render báo Live nhưng /health vẫn ở commit '$commit' thay vì '$GITHUB_SHA'. Nghĩa là bản build không mang commit này — nghi ngờ theo thứ tự: (1) API bỏ qua commitId và vẫn dùng ref đóng băng, (2) deploy trúng service orphan chứ không phải $RENDER_SERVICE_ID, (3) tiến trình chết lúc khởi động nên Render giữ instance cũ phục vụ tiếp."
          exit 1
